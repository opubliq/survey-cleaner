default_model: "anthropic/claude-sonnet-4-20250514"

tier_models:
  tier1_validator:
    model: "anthropic/claude-sonnet-4-20250514"
    description: "Pattern-based validation using predefined patterns"
  tier2_batch:
    model: "anthropic/claude-sonnet-4-20250514"
    description: "Semi-standard batch processing with LLM"
  tier3_individual:
    model: "anthropic/claude-sonnet-4-20250514"
    description: "Complex individual variable processing"

tier1_min_confidence: 0.8
tier1_max_n_unique: 7
tier2_max_batch_size: 20

data_dir: null
output_dir: null

watch:
  interval_minutes: 5
  auto_process: true
